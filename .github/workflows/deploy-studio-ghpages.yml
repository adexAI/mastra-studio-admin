name: Deploy Studio to GitHub Pages

on:
  push:
    branches:
      - deploy
  workflow_dispatch:
    inputs:
      mastra_server_host:
        description: "Mastra server host (e.g. https://chatdev.adex.network/mastra/api)"
        required: false
        type: string
      mastra_server_port:
        description: "Mastra server port"
        required: false
        default: "443"
        type: string
      mastra_server_protocol:
        description: "Mastra server protocol (http or https)"
        required: false
        default: "https"
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build and Deploy Studio
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      MASTRA_SERVER_HOST: ${{ inputs.mastra_server_host || secrets.MASTRA_SERVER_HOST }}
      MASTRA_SERVER_PORT: ${{ inputs.mastra_server_port || secrets.MASTRA_SERVER_PORT || '443' }}
      MASTRA_SERVER_PROTOCOL: ${{ inputs.mastra_server_protocol || secrets.MASTRA_SERVER_PROTOCOL || 'https' }}
      MASTRA_STUDIO_BASE_PATH: ""
      MASTRA_HIDE_CLOUD_CTA: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build playground
        run: pnpm turbo build --filter ./packages/playground --filter ./packages/playground-ui

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: packages/playground/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
